name: Sync Google Places

on:
  schedule:
    - cron: "0 3 1 * *" # 1st of every month, 03:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node scripts/sync-google-places.mjs
        env:
          # Single environment: production. (The old dev project was deleted
          # 2026-07-13; the unprefixed SUPABASE_* secrets are dead.)
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      # Pre-generate _w430/_w200 variants for any photos the sync (or a
      # map-picker import) added. Idempotent — existing variants are skipped.
      # This replaces Supabase image transformations, which bill per origin
      # image and exhausted the Pro quota (100/month) within days.
      - run: node scripts/generate-image-variants.mjs
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
